name: Flutter CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  flutter-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release metadata
        run: dart run tool/verify_release.dart

      - name: Analyze
        run: flutter analyze

      - name: Stress Ubuntu regression tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for iteration in {1..10}; do
            echo "Dynamic navigation iteration ${iteration}/10"
            flutter test --no-pub test/widget_test.dart --plain-name "app shell handles keyboard and dynamic portrait sizes"
            echo "Playlist reorder iteration ${iteration}/10"
            flutter test --no-pub test/player_playlist_widgets_test.dart --plain-name "playlist cards freeze background updates while reordering"
          done

      - name: Stress Windows rename regression test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          for ($iteration = 1; $iteration -le 10; $iteration++) {
            Write-Output "Windows rename iteration $iteration/10"
            flutter test --no-pub test/audio_provider_audio_detail_cover_test.dart --plain-name "renaming an active folder keeps playlist track lookups after stale native paths"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: flutter test --concurrency=1

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: flutter test --coverage --concurrency=1

      - name: Verify coverage baseline
        if: matrix.os == 'ubuntu-latest'
        run: dart run tool/verify_coverage.dart

  android:
    needs: flutter-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release signing cannot fall back to debug
        working-directory: android
        run: |
          if ./gradlew :app:validateReleaseSigning; then
            echo "Release signing validation unexpectedly passed without key.properties"
            exit 1
          fi

      - name: Android JVM tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: flutter build apk --debug

  windows-build:
    needs: flutter-test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Patch smtc_windows cargokit
        shell: pwsh
        run: ./tool/patch_smtc_windows_cargokit.ps1

      - name: Build Windows release
        run: flutter build windows

  release-android:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - android
      - windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release metadata
        run: dart run tool/verify_release.dart --tag "$GITHUB_REF_NAME"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal release APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "NamelessAudio-android-universal-${GITHUB_REF_NAME}.apk"

      - name: Build split release APKs
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64

      - name: Prepare Android release assets
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "NamelessAudio-android-arm64-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "NamelessAudio-android-armv7-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "NamelessAudio-android-x64-${GITHUB_REF_NAME}.apk"
          for apk in NamelessAudio-android-*-${GITHUB_REF_NAME}.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Verify Android release assets
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${ANDROID_SIGNING_CERT_SHA256:?ANDROID_SIGNING_CERT_SHA256 is required}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          expected_cert_sha256="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          for apk in NamelessAudio-android-*-${GITHUB_REF_NAME}.apk; do
            test -s "$apk"
            test -s "$apk.sha256"
            sha256sum --check "$apk.sha256"
            signature_file="${apk}.signature.txt"
            "$apksigner" verify --verbose --print-certs "$apk" | tee "$signature_file"
            actual_cert_sha256="$(
              sed -n 's/^.*certificate SHA-256 digest: //p' "$signature_file" |
                head -n 1 |
                tr '[:upper:]' '[:lower:]'
            )"
            test "$actual_cert_sha256" = "$expected_cert_sha256"
          done

          has_abi() {
            unzip -Z1 "$1" | grep "^lib/$2/" >/dev/null
          }
          universal="NamelessAudio-android-universal-${GITHUB_REF_NAME}.apk"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            has_abi "$universal" "$abi"
          done
          while read -r variant expected_abi; do
            apk="NamelessAudio-android-${variant}-${GITHUB_REF_NAME}.apk"
            for abi in armeabi-v7a arm64-v8a x86_64; do
              if [ "$abi" = "$expected_abi" ]; then
                has_abi "$apk" "$abi"
              elif has_abi "$apk" "$abi"; then
                echo "Unexpected ABI $abi in $apk"
                exit 1
              fi
            done
          done <<'EOF'
          arm64 arm64-v8a
          armv7 armeabi-v7a
          x64 x86_64
          EOF

      - name: Store verified Android release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            NamelessAudio-android-universal-${{ github.ref_name }}.apk
            NamelessAudio-android-universal-${{ github.ref_name }}.apk.sha256
            NamelessAudio-android-arm64-${{ github.ref_name }}.apk
            NamelessAudio-android-arm64-${{ github.ref_name }}.apk.sha256
            NamelessAudio-android-armv7-${{ github.ref_name }}.apk
            NamelessAudio-android-armv7-${{ github.ref_name }}.apk.sha256
            NamelessAudio-android-x64-${{ github.ref_name }}.apk
            NamelessAudio-android-x64-${{ github.ref_name }}.apk.sha256

  release-windows:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - android
      - windows-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Patch smtc_windows cargokit
        shell: pwsh
        run: ./tool/patch_smtc_windows_cargokit.ps1

      - name: Verify release metadata
        run: dart run tool/verify_release.dart --tag "${{ github.ref_name }}"

      - name: Download verified Windows FFmpeg tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseBaseUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest'
          $ffmpegName = 'ffmpeg-master-latest-win64-gpl.zip'
          $zip = Join-Path $env:RUNNER_TEMP $ffmpegName
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          $checksums = Join-Path $env:RUNNER_TEMP 'ffmpeg-checksums.sha256'
          Invoke-WebRequest `
            -Uri "$releaseBaseUrl/checksums.sha256" `
            -OutFile $checksums
          $checksumLine = Get-Content -LiteralPath $checksums |
            ForEach-Object {
              $parts = $_.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
              if ($parts.Count -ge 2 -and $parts[-1].TrimStart('*') -eq $ffmpegName) {
                $_
              }
            } |
            Select-Object -First 1
          if (-not $checksumLine) {
            throw "FFmpeg checksum entry not found for $ffmpegName"
          }
          $expectedSha256 = $checksumLine.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].ToLowerInvariant()
          Invoke-WebRequest `
            -Uri "$releaseBaseUrl/$ffmpegName" `
            -OutFile $zip
          $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $bin = Get-ChildItem -LiteralPath $extract -Directory |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName 'bin' }
          New-Item -ItemType Directory -Force -Path assets\ffmpeg | Out-Null
          Copy-Item -LiteralPath (Join-Path $bin 'ffmpeg.exe') -Destination assets\ffmpeg\ffmpeg.exe -Force
          Copy-Item -LiteralPath (Join-Path $bin 'ffprobe.exe') -Destination assets\ffmpeg\ffprobe.exe -Force

      - name: Build Windows release
        run: flutter build windows

      - name: Create Windows release assets
        shell: pwsh
        run: |
          $zipName = "NamelessAudio-windows-x64-${{ github.ref_name }}.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $zipName -Force
          $hash = (Get-FileHash -LiteralPath $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath "$zipName.sha256" -Encoding ascii

      - name: Verify Windows release assets
        shell: pwsh
        run: |
          $zipName = "NamelessAudio-windows-x64-${{ github.ref_name }}.zip"
          if (-not (Test-Path -LiteralPath $zipName -PathType Leaf)) {
            throw "Missing release ZIP: $zipName"
          }
          $checksumPath = "$zipName.sha256"
          $expected = (Get-Content -LiteralPath $checksumPath -Raw).Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Windows release checksum mismatch: expected $expected, got $actual"
          }

      - name: Store verified Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            NamelessAudio-windows-x64-${{ github.ref_name }}.zip
            NamelessAudio-windows-x64-${{ github.ref_name }}.zip.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release-android
      - release-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download verified Android assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-android-${{ github.ref_name }}
          path: release-assets

      - name: Download verified Windows assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-${{ github.ref_name }}
          path: release-assets

      - name: Verify complete release payload
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cat > expected-assets.txt <<EOF
          NamelessAudio-android-universal-${tag}.apk
          NamelessAudio-android-universal-${tag}.apk.sha256
          NamelessAudio-android-arm64-${tag}.apk
          NamelessAudio-android-arm64-${tag}.apk.sha256
          NamelessAudio-android-armv7-${tag}.apk
          NamelessAudio-android-armv7-${tag}.apk.sha256
          NamelessAudio-android-x64-${tag}.apk
          NamelessAudio-android-x64-${tag}.apk.sha256
          NamelessAudio-windows-x64-${tag}.zip
          NamelessAudio-windows-x64-${tag}.zip.sha256
          EOF
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          sort -o expected-assets.txt expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          for checksum in release-assets/*.sha256; do
            (cd release-assets && sha256sum --check "$(basename "$checksum")")
          done

      - name: Publish complete release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace an existing public release for $tag"
              exit 1
            fi
            gh release delete "$tag" --yes
          fi
          version="${tag#v}"
          gh release create "$tag" \
            --verify-tag \
            --draft \
            --title "Nameless Audio $version" \
            --notes-file release_notes.md
          gh release upload "$tag" release-assets/*
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > published-assets.txt
          diff -u expected-assets.txt published-assets.txt
          gh release edit "$tag" --draft=false --prerelease=false --latest
