name: Flutter CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release metadata
        run: dart run tool/verify_release.dart

      - name: Analyze
        run: flutter analyze

      - name: Stress Ubuntu regression tests
        shell: bash
        run: |
          for iteration in {1..10}; do
            echo "Dynamic navigation iteration ${iteration}/10"
            flutter test --no-pub test/widget_test.dart --plain-name "app shell handles keyboard and dynamic portrait sizes"
            echo "Playlist reorder iteration ${iteration}/10"
            flutter test --no-pub test/player_playlist_widgets_test.dart --plain-name "playlist cards freeze background updates while reordering"
          done

      - name: Test with coverage
        run: flutter test --coverage --concurrency=1

      - name: Verify coverage baseline
        run: dart run tool/verify_coverage.dart

  android:
    needs: flutter-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release signing cannot fall back to debug
        working-directory: android
        run: |
          if ./gradlew :app:validateReleaseSigning; then
            echo "Release signing validation unexpectedly passed without key.properties"
            exit 1
          fi

      - name: Android JVM tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: flutter build apk --debug

  android-device:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: |
            flutter test integration_test/app_smoke_test.dart -d emulator-5554 || { adb logcat -d > android-device-logcat.txt || true; adb exec-out screencap -p > android-device-screen.png || true; exit 1; }
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then flutter test integration_test/android_native_smoke_test.dart -d emulator-5554 || { adb logcat -d > android-device-logcat.txt || true; adb exec-out screencap -p > android-device-screen.png || true; exit 1; }; fi

      - name: Upload Android device diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            android-device-logcat.txt
            android-device-screen.png

  release-android:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - android
      - android-device
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify tag source and main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          main_ci_run="$(
            gh run list \
              --workflow flutter.yml \
              --branch main \
              --commit "$GITHUB_SHA" \
              --event push \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          if [ -z "$main_ci_run" ]; then
            echo "No successful main-branch Flutter CI run found for $GITHUB_SHA"
            exit 1
          fi
          echo "Verified successful main-branch Flutter CI run: $main_ci_run"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify release metadata
        run: dart run tool/verify_release.dart --tag "$GITHUB_REF_NAME"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Preserve universal release APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "DoujinAudio-android-universal-${GITHUB_REF_NAME}.apk"

      - name: Build split release APKs
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64,android-x64

      - name: Prepare Android release assets
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "DoujinAudio-android-arm64-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "DoujinAudio-android-armv7-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "DoujinAudio-android-x64-${GITHUB_REF_NAME}.apk"
          for apk in DoujinAudio-android-*-${GITHUB_REF_NAME}.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Verify Android release assets
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${ANDROID_SIGNING_CERT_SHA256:?ANDROID_SIGNING_CERT_SHA256 is required}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          expected_cert_sha256="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          for apk in DoujinAudio-android-*-${GITHUB_REF_NAME}.apk; do
            test -s "$apk"
            test -s "$apk.sha256"
            sha256sum --check "$apk.sha256"
            signature_file="${apk}.signature.txt"
            "$apksigner" verify --verbose --print-certs "$apk" | tee "$signature_file"
            actual_cert_sha256="$(
              sed -n 's/^.*certificate SHA-256 digest: //p' "$signature_file" |
                head -n 1 |
                tr '[:upper:]' '[:lower:]'
            )"
            test "$actual_cert_sha256" = "$expected_cert_sha256"
          done

          has_abi() {
            unzip -Z1 "$1" | grep "^lib/$2/" >/dev/null
          }
          universal="DoujinAudio-android-universal-${GITHUB_REF_NAME}.apk"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            has_abi "$universal" "$abi"
          done
          while read -r variant expected_abi; do
            apk="DoujinAudio-android-${variant}-${GITHUB_REF_NAME}.apk"
            for abi in armeabi-v7a arm64-v8a x86_64; do
              if [ "$abi" = "$expected_abi" ]; then
                has_abi "$apk" "$abi"
              elif has_abi "$apk" "$abi"; then
                echo "Unexpected ABI $abi in $apk"
                exit 1
              fi
            done
          done <<'EOF'
          arm64 arm64-v8a
          armv7 armeabi-v7a
          x64 x86_64
          EOF

      - name: Store verified Android release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            DoujinAudio-android-universal-${{ github.ref_name }}.apk
            DoujinAudio-android-universal-${{ github.ref_name }}.apk.sha256
            DoujinAudio-android-arm64-${{ github.ref_name }}.apk
            DoujinAudio-android-arm64-${{ github.ref_name }}.apk.sha256
            DoujinAudio-android-armv7-${{ github.ref_name }}.apk
            DoujinAudio-android-armv7-${{ github.ref_name }}.apk.sha256
            DoujinAudio-android-x64-${{ github.ref_name }}.apk
            DoujinAudio-android-x64-${{ github.ref_name }}.apk.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download verified Android assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-android-${{ github.ref_name }}
          path: release-assets

      - name: Verify complete release payload
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cat > expected-assets.txt <<EOF
          DoujinAudio-android-universal-${tag}.apk
          DoujinAudio-android-universal-${tag}.apk.sha256
          DoujinAudio-android-arm64-${tag}.apk
          DoujinAudio-android-arm64-${tag}.apk.sha256
          DoujinAudio-android-armv7-${tag}.apk
          DoujinAudio-android-armv7-${tag}.apk.sha256
          DoujinAudio-android-x64-${tag}.apk
          DoujinAudio-android-x64-${tag}.apk.sha256
          EOF
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          sort -o expected-assets.txt expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          for checksum in release-assets/*.sha256; do
            (cd release-assets && sha256sum --check "$(basename "$checksum")")
          done

      - name: Publish complete release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace an existing public release for $tag"
              exit 1
            fi
            gh release delete "$tag" --yes
          fi
          version="${tag#v}"
          gh release create "$tag" \
            --verify-tag \
            --draft \
            --title "Doujin Audio $version" \
            --notes-file release_notes.md
          gh release upload "$tag" release-assets/*
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > published-assets.txt
          diff -u expected-assets.txt published-assets.txt
          gh release edit "$tag" --draft=false --prerelease=false --latest
