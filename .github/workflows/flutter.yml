name: Flutter CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android JVM tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: flutter build apk --debug

  release-android:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build arm64 release APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare Android release assets
        run: |
          set -euo pipefail
          apk="NamelessAudio-android-arm64-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload Android release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            "NamelessAudio-android-arm64-${GITHUB_REF_NAME}.apk" \
            "NamelessAudio-android-arm64-${GITHUB_REF_NAME}.apk.sha256" \
            --clobber

  release-windows:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - verify
      - release-android
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Download verified Windows FFmpeg tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpegName = 'ffmpeg-N-124953-gd30dead35e-win64-gpl.zip'
          $expectedSha256 = '1610cd7b4d691f0e70ea6f52b5dba0c9fa6207c62b6936ac9f0178f7527438'
          $zip = Join-Path $env:RUNNER_TEMP $ffmpegName
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-06-11-14-22/$ffmpegName" `
            -OutFile $zip
          $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $bin = Get-ChildItem -LiteralPath $extract -Directory |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName 'bin' }
          New-Item -ItemType Directory -Force -Path assets\ffmpeg | Out-Null
          Copy-Item -LiteralPath (Join-Path $bin 'ffmpeg.exe') -Destination assets\ffmpeg\ffmpeg.exe -Force
          Copy-Item -LiteralPath (Join-Path $bin 'ffprobe.exe') -Destination assets\ffmpeg\ffprobe.exe -Force

      - name: Build Windows release
        run: flutter build windows

      - name: Create Windows release assets
        shell: pwsh
        run: |
          $zipName = "NamelessAudio-windows-x64-${{ github.ref_name }}.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $zipName -Force
          $hash = (Get-FileHash -LiteralPath $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath "$zipName.sha256" -Encoding ascii

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "NamelessAudio-windows-x64-${{ github.ref_name }}.zip" `
            "NamelessAudio-windows-x64-${{ github.ref_name }}.zip.sha256" `
            --clobber
