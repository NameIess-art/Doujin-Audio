name: doujin_audio
description: Local audio player for multi-session ASMR and voice library playback.
publish_to: 'none'
version: 0.21.0+2100

environment:
  sdk: ^3.11.1

hooks:
  user_defines:
    sqlite3:
      source: system
      name_android: sqlite
      name: sqlite3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  file_picker: ^11.0.2
  permission_handler: ^12.0.1
  path: ^1.9.1
  mime: ^2.0.0
  meta: ^1.17.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.1
  flutter_secure_storage: ^10.3.1
  sqflite: ^2.4.2
  flutter_riverpod: ^3.4.2
  audio_session: ^0.2.4
  ffmpeg_kit_flutter_new_audio: ^2.0.0
  lottie: ^3.3.3
  crypto: ^3.0.6
  archive: ^4.0.9
  pub_semver: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6
  flutter_lints: ^6.0.0




flutter:
  uses-material-design: true
  assets:
    - assets/lottie/empty_library.json
    - assets/icons/app_mark_light.png
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Variable.ttf
